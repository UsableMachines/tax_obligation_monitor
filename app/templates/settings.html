{% extends "base.html" %}
{% block page_title %}Settings{% endblock %}
{% block title %}Settings — Tax Obligation Monitor{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header"><h3><i class="fas fa-palette"></i> Appearance</h3></div>
  <div class="card-body">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Theme</label>
        <div class="theme-options">
          <label class="radio-card">
            <input type="radio" name="theme" value="light" {% if current_user.theme == 'light' %}checked{% endif %}>
            <span><i class="fas fa-sun"></i> Light</span>
          </label>
          <label class="radio-card">
            <input type="radio" name="theme" value="dark" {% if current_user.theme == 'dark' %}checked{% endif %}>
            <span><i class="fas fa-moon"></i> Dark</span>
          </label>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
  </div>
</div>
{% endblock %}
